# Local development only. Do not expose this database or reuse its credentials in production.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: statixel
      POSTGRES_PASSWORD: statixel_local_only
      POSTGRES_DB: statixel
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - statixel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statixel -d statixel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  statixel_postgres_data:
